<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5A52"/>
    </marker>
    <style>
      .box { fill:#FFFFFF; stroke:#C9D3CE; stroke-width:1.5; }
      .brand { fill:#006A4D; }
      .title { font-size:15px; font-weight:600; fill:#1B2B24; }
      .sub { font-size:12px; fill:#4A5A52; }
      .tiny { font-size:11px; fill:#4A5A52; }
      .hdr { font-size:12px; font-weight:700; fill:#FFFFFF; letter-spacing:.5px; }
      .line { stroke:#4A5A52; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#4A5A52; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#arrow); }
      .layer { fill:#EEF4F1; stroke:#B7CBC1; stroke-width:1; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#F7F9F8"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1B2B24">UK Retail &amp; SME Banking | End-to-end Azure analytics pipeline</text>
  <text x="40" y="68" class="sub">Hypothetical data (Lloyds Banking Group case study) | 500k customers | Jan 2020 to Aug 2026 | ~96M rows</text>

  <!-- 1 Source -->
  <rect x="40" y="120" width="190" height="150" rx="10" class="box"/>
  <rect x="40" y="120" width="190" height="30" rx="10" class="brand"/><rect x="40" y="138" width="190" height="12" class="brand"/>
  <text x="55" y="140" class="hdr">1 | SOURCE SYSTEMS</text>
  <text x="55" y="176" class="title">Python generator</text>
  <text x="55" y="196" class="sub">8 simulated systems</text>
  <text x="55" y="214" class="sub">Core banking, lending,</text>
  <text x="55" y="230" class="sub">payments, digital, conduct</text>
  <text x="55" y="252" class="tiny">Parquet | dirty data injected</text>

  <!-- BoE -->
  <rect x="40" y="320" width="190" height="110" rx="10" class="box"/>
  <rect x="40" y="320" width="190" height="30" rx="10" class="brand"/><rect x="40" y="338" width="190" height="12" class="brand"/>
  <text x="55" y="340" class="hdr">EXTERNAL API</text>
  <text x="55" y="376" class="title">Bank of England</text>
  <text x="55" y="396" class="sub">Bank Rate (IUDBEDR)</text>
  <text x="55" y="414" class="tiny">real data | fallback file</text>

  <!-- 2 Lake -->
  <rect x="290" y="120" width="190" height="150" rx="10" class="box"/>
  <rect x="290" y="120" width="190" height="30" rx="10" class="brand"/><rect x="290" y="138" width="190" height="12" class="brand"/>
  <text x="305" y="140" class="hdr">2 | DATA LAKE</text>
  <text x="305" y="176" class="title">ADLS Gen2</text>
  <text x="305" y="196" class="sub">container: landing</text>
  <text x="305" y="214" class="sub">source/table/</text>
  <text x="305" y="230" class="sub">year=YYYY/month=MM</text>
  <text x="305" y="252" class="tiny">1.9 GB Parquet | UK South</text>

  <!-- 3 ADF -->
  <rect x="540" y="120" width="210" height="310" rx="10" class="box"/>
  <rect x="540" y="120" width="210" height="30" rx="10" class="brand"/><rect x="540" y="138" width="210" height="12" class="brand"/>
  <text x="555" y="140" class="hdr">3 | ORCHESTRATION</text>
  <text x="555" y="176" class="title">Azure Data Factory</text>
  <text x="555" y="198" class="sub">Metadata-driven</text>
  <text x="555" y="214" class="sub">(ops.load_config)</text>
  <text x="555" y="240" class="sub">FULL backfill or</text>
  <text x="555" y="256" class="sub">INCREMENTAL by watermark</text>
  <text x="555" y="282" class="sub">Try/catch API fallback</text>
  <text x="555" y="308" class="sub">Run logging + lineage</text>
  <text x="555" y="324" class="sub">($$FILEPATH)</text>
  <text x="555" y="350" class="sub">Managed identity</text>
  <text x="555" y="366" class="sub">(no keys stored)</text>
  <text x="555" y="392" class="sub">Infrastructure as Code</text>
  <text x="555" y="408" class="tiny">ARM template</text>

  <!-- 4 SQL -->
  <rect x="795" y="120" width="225" height="310" rx="10" class="box"/>
  <rect x="795" y="120" width="225" height="30" rx="10" class="brand"/><rect x="795" y="138" width="225" height="12" class="brand"/>
  <text x="810" y="140" class="hdr">4 | WAREHOUSE</text>
  <text x="810" y="176" class="title">Azure SQL Database</text>
  <text x="810" y="194" class="tiny">serverless | free offer</text>
  <rect x="810" y="208" width="195" height="30" rx="5" class="layer"/><text x="822" y="228" class="sub">stg | raw copy</text>
  <rect x="810" y="244" width="195" height="30" rx="5" class="layer"/><text x="822" y="264" class="sub">silver | cleansed</text>
  <rect x="810" y="280" width="195" height="30" rx="5" class="layer"/><text x="822" y="300" class="sub">gold | star schema</text>
  <rect x="810" y="316" width="195" height="30" rx="5" class="layer"/><text x="822" y="336" class="sub">mart | BI-ready</text>
  <rect x="810" y="352" width="195" height="30" rx="5" class="layer"/><text x="822" y="372" class="sub">ops | logs, DQ, watermark</text>
  <text x="810" y="408" class="tiny">Columnstore | Sweden Central</text>

  <!-- 5 Power BI -->
  <rect x="1058" y="120" width="112" height="310" rx="10" class="box"/>
  <rect x="1058" y="120" width="112" height="30" rx="10" class="brand"/><rect x="1058" y="138" width="112" height="12" class="brand"/>
  <text x="1070" y="140" class="hdr">5 | BI</text>
  <text x="1070" y="176" class="title">Power BI</text>
  <text x="1070" y="200" class="sub">Import mart</text>
  <text x="1070" y="224" class="sub">DAX measures</text>
  <text x="1070" y="248" class="sub">RLS by region</text>
  <text x="1070" y="272" class="sub">Exec pages:</text>
  <text x="1070" y="290" class="tiny">Profitability</text>
  <text x="1070" y="306" class="tiny">Credit risk</text>
  <text x="1070" y="322" class="tiny">Digital, conduct</text>

  <!-- arrows -->
  <path d="M230,195 L286,195" class="line"/>
  <text x="236" y="186" class="tiny">upload</text>
  <path d="M480,195 L536,195" class="line"/>
  <path d="M230,375 L536,375" class="dash"/>
  <text x="330" y="366" class="tiny">HTTP (CSV)</text>
  <path d="M750,275 L791,275" class="line"/>
  <path d="M1020,275 L1054,275" class="line"/>

  <!-- footer -->
  <rect x="40" y="462" width="1130" height="78" rx="10" fill="#FFFFFF" stroke="#C9D3CE"/>
  <text x="60" y="487" class="title">Engineering practices</text>
  <text x="60" y="507" class="sub">Idempotent loads (delete + insert per month) | MERGE for dimensions (stable surrogate keys) | automated data quality rules logged to ops.dq_results</text><text x="60" y="525" class="sub">Least-privilege SQL users | managed identity to the lake | cost guardrails (free tiers, auto-pause, budget alert, triggers deployed stopped)</text>
</svg>
